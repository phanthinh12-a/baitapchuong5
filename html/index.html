<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Máy tính cơ bản</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Máy tính cơ bản</h1>

            <form method="post" action="/" novalidate>
              <div class="mb-3">
                <label for="a" class="form-label fw-semibold">Số thứ nhất (a)</label>
                <input type="text" id="a" name="a" value="{{ form.a }}"
                       class="form-control {% if errors.a %}is-invalid{% endif %}">
                {% if errors.a %}<div class="invalid-feedback">{{ errors.a }}</div>{% endif %}
              </div>

              <div class="mb-3">
                <label for="op" class="form-label fw-semibold">Phép toán</label>
                <select id="op" name="op"
                        class="form-select {% if errors.op %}is-invalid{% endif %}">
                  {% for o in operators %}
                    <option value="{{ o }}" {% if form.op == o %}selected{% endif %}>{{ o }}</option>
                  {% endfor %}
                </select>
                {% if errors.op %}<div class="invalid-feedback">{{ errors.op }}</div>{% endif %}
              </div>

              <div class="mb-4">
                <label for="b" class="form-label fw-semibold">Số thứ hai (b)</label>
                <input type="text" id="b" name="b" value="{{ form.b }}"
                       class="form-control {% if errors.b %}is-invalid{% endif %}">
                {% if errors.b %}<div class="invalid-feedback">{{ errors.b }}</div>{% endif %}
              </div>

              <button type="submit" class="btn btn-primary w-100">Tính</button>
            </form>

            {% if result %}
              <div class="alert alert-success text-center fs-5 fw-semibold mt-4 mb-0">{{ result }}</div>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
