<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tính điểm học phần</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Tính điểm học phần</h1>

            <form method="post" action="/" novalidate>
              <div class="mb-3">
                <label for="cc" class="form-label fw-semibold">Chuyên cần (CC) – 10%</label>
                <input type="text" id="cc" name="cc" value="{{ form.cc }}"
                       class="form-control {% if errors.cc %}is-invalid{% endif %}">
                {% if errors.cc %}<div class="invalid-feedback">{{ errors.cc }}</div>{% endif %}
              </div>

              <div class="mb-3">
                <label for="gk" class="form-label fw-semibold">Giữa kỳ (GK) – 30%</label>
                <input type="text" id="gk" name="gk" value="{{ form.gk }}"
                       class="form-control {% if errors.gk %}is-invalid{% endif %}">
                {% if errors.gk %}<div class="invalid-feedback">{{ errors.gk }}</div>{% endif %}
              </div>

              <div class="mb-4">
                <label for="ck" class="form-label fw-semibold">Cuối kỳ (CK) – 60%</label>
                <input type="text" id="ck" name="ck" value="{{ form.ck }}"
                       class="form-control {% if errors.ck %}is-invalid{% endif %}">
                {% if errors.ck %}<div class="invalid-feedback">{{ errors.ck }}</div>{% endif %}
              </div>

              <button type="submit" class="btn btn-primary w-100">Tính điểm</button>
            </form>

            {% if result %}
              <div class="alert alert-success text-center fs-5 fw-semibold mt-4 mb-0">{{ result }}</div>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
