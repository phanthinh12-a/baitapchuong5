<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tính chỉ số BMI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Tính chỉ số BMI</h1>

            <form method="post" action="/" novalidate>
              <div class="mb-3">
                <label for="cao" class="form-label fw-semibold">Chiều cao (cm)</label>
                <input type="text" id="cao" name="cao" value="{{ form.cao }}"
                       class="form-control {% if errors.cao %}is-invalid{% endif %}">
                {% if errors.cao %}<div class="invalid-feedback">{{ errors.cao }}</div>{% endif %}
              </div>

              <div class="mb-4">
                <label for="nang" class="form-label fw-semibold">Cân nặng (kg)</label>
                <input type="text" id="nang" name="nang" value="{{ form.nang }}"
                       class="form-control {% if errors.nang %}is-invalid{% endif %}">
                {% if errors.nang %}<div class="invalid-feedback">{{ errors.nang }}</div>{% endif %}
              </div>

              <button type="submit" class="btn btn-primary w-100">Tính BMI</button>
            </form>

            {% if result %}
              <div class="alert alert-{{ result.color }} text-center mt-4 mb-0">
                <div class="fs-4 fw-semibold">{{ result.text }}</div>
                <div>{{ result.range }}</div>
              </div>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
