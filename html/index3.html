<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu bài tập chương 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center mb-2">Bài tập chương 5</h1>
    <p class="text-center text-muted mb-5">Chọn một bài để bắt đầu</p>

    <div class="row g-4 justify-content-center">
      {% for item in items %}
      <div class="col-md-4">
        <div class="card h-100 shadow-sm text-center">
          <div class="card-body d-flex flex-column p-4">
            <div class="display-4 mb-3">{{ item.icon }}</div>
            <h2 class="h5">{{ item.title }}</h2>
            <p class="text-muted">{{ item.desc }}</p>
            <a href="{{ item.url }}" class="btn btn-primary mt-auto">Mở bài {{ loop.index }}</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
